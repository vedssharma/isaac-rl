# Copies the Isaac Sim wheels from pypi.nvidia.com into a PRIVATE Hugging Face
# repo, because Daytona Tier 1/2 sandboxes can reach huggingface.co but not
# NVIDIA's index. Run once per Isaac Sim version: Actions tab -> this workflow
# -> Run workflow. Needs the HF_TOKEN repository secret (write access).
#
# Keep the HF repo private: the wheels are under NVIDIA's license and are
# mirrored only for this project's own use.
name: Mirror Isaac Sim wheels to Hugging Face

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: "Private HF repo for the wheels, e.g. <hf-username>/isaacsim-wheels"
        required: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: ${{ inputs.hf_repo }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install "huggingface-hub==2.4.0"

      - name: Check token
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add an HF_TOKEN repository secret first"; exit 1; fi
          hf auth whoami

      - name: Create private repo (no-op if it exists)
        run: hf repos create "$HF_REPO" --private --exist-ok

      # One package at a time (download, upload, delete) so the runner's
      # limited disk never has to hold every wheel at once.
      - name: Mirror wheels
        run: |
          mkdir -p wheels
          grep -vE '^\s*(#|$)' scripts/daytona/isaacsim_wheels.txt | while read -r spec; do
            echo "::group::$spec"
            pip download "$spec" --no-deps --only-binary=:all: \
              --platform manylinux_2_35_x86_64 --python-version 3.11 \
              --index-url https://pypi.nvidia.com --dest wheels
            ls -lh wheels
            hf upload "$HF_REPO" wheels . --private --commit-message "Add $spec"
            rm -f wheels/*
            df -h . | tail -1
            echo "::endgroup::"
          done

      - name: List mirrored files
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          files = HfApi().list_repo_files(os.environ["HF_REPO"])
          wheels = sorted(f for f in files if f.endswith(".whl"))
          print(f"{len(wheels)} wheels in {os.environ['HF_REPO']}:")
          print("\n".join(wheels))
          PY
